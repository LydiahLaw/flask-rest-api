name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app.py tests --max-line-length=100

      - name: Run tests
        run: pytest -v

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t flask-rest-api:${{ github.sha }} .

      - name: Start container
        run: docker run -d --name api -p 5000:5000 flask-rest-api:${{ github.sha }}

      - name: Check /health responds
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "Health check failed"
          docker logs api
          exit 1
